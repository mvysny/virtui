name: Ruby Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true  # Automatically runs 'bundle install' and caches gems (keyed on Gemfile.lock + Ruby version)

    - name: Run tests
      run: bundle exec rake

  # The doc-layer checks alone (also part of `rake` above): bash + git, no Ruby needed.
  design-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Design-doc tripwires
      run: design/verify_design_tripwires.sh

